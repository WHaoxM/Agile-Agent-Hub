[project]
name = "agile-agent-hub"
version = "0.1.0"
description = "Agile Agent Hub - 将非结构化聊天记录提取为标准化待办任务的本地智能体流水线"
requires-python = ">=3.10"
authors = [
    { name = "Your Name", email = "you@example.com" }
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "openai>=1.0.0",
    "httpx>=0.25.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
